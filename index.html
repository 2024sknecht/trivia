<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Random Trivia</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Random Trivia</h1>

      <div id="controls">
        <label for="amount">Number of questions:</label>
        <input id="amount" type="number" min="1" max="50" value="5" />

        <label for="type">Type:</label>
        <select id="type">
          <option value="any">Any</option>
          <option value="multiple" selected>Multiple Choice</option>
          <option value="boolean">True / False</option>
        </select>
        
        <label for="category">Category:</label>
        <select id="category">
          <option value="any">Any Category</option>
        </select>

        <button id="load-btn">Load Trivia</button>
      </div>

      <div id="score-container">
        <div id="score">Score: 0 / 0</div>
        <button id="reset-score">Reset Score</button>
        <div id="selected-category">Category: Any Category</div>
      </div>

      <div id="status" aria-live="polite"></div>

      <div id="progress-wrap">
        <div id="progress-text">Progress: 0 / 0</div>
        <div id="progress"><div id="progress-bar" style="width:0%"></div></div>
      </div>
      
      <ul id="trivia-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
